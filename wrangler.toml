name = "unstable-universe"
main = "./worker.js"
compatibility_date = "2026-11-15"
keep_vars = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Accounts + cross-device sync. No database_id on purpose: Wrangler (4.45+)
# creates this D1 database automatically on the first deploy and keeps it linked.
# If you create it by hand instead, give it this exact name.
[[d1_databases]]
binding = "DB"
database_name = "unstable-universe-accounts"

# Accounts allowed into the admin panel (comma-separated usernames).
[vars]
ADMIN_USERNAMES = "cjprogod3"

# Check the playlist for new uploads every 30 minutes and send notifications.
[triggers]
crons = ["*/30 * * * *"]
